<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Snakes, Ladders and Chaos!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="assets/dice_no_6.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
  <!-- Everything lives on a fixed 1920x1080 "stage" that main.js scales to fit the window. -->
  <div id="stage">
    <div id="game">                              <!-- hidden until Start is pressed -->
      <div id="boxes"></div>                     <!-- the red container behind the board (main.js draws it from BOXES) -->
      <div id="board"></div>                     <!-- left: the board SVG (render.js buildBoard) -->
      <div id="tray"><div id="dice"></div></div> <!-- the dice layer: covers the board while dice are on the table (input.js) -->
      <button id="rollBtn" onclick="rollPressed()"><img class="rsh" src="assets/button_roll_shadow.svg" alt=""><img class="rface" src="assets/button_roll.svg" alt=""></button>   <!-- big ROLL button in the middle of the board -->
      <div id="prompt">                          <!-- message over the board: a small banner at the top, or a dialog in the middle (input.js setPrompt) -->
        <div id="ptxt"></div><div id="btns"></div>
        <button id="moveBtn" class="cbtn alt"><span>Move for me</span></button>   <!-- helper button: "Move for me" / "Roll" / "Cancel" (hidden unless needed) -->
      </div>
      <div id="shade"></div>                     <!-- dark layer over the board while the active player must act (shown by "#prompt.choice ~ #shade" in css) -->
      <div id="panels"></div>                    <!-- right, top: the player panels (render.js buildPanels / placePanels) -->
      <!-- right column below the player panels: ONE view at a time (main.js showTab); each panel (class "rp") slides in from the right edge -->
      <div id="sidebox">
        <div id="evPanel" class="rp lp"><div id="evText"></div></div>            <!-- Current Event: the latest log / flavour lines in a big font (default view) -->
        <div id="aboutPanel" class="rp lp">                                       <!-- Information (can expand) -->
          <button id="expand" title="Expand" onclick="expandPanel()"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 4h6M4 4v6M4 4l6 6M20 20h-6M20 20v-6M20 20l-6-6M20 4h-6M20 4v6M20 4l-6 6M4 20h6M4 20v-6M4 20l6-6" fill="none" stroke="#2f2504" stroke-width="2.4" stroke-linecap="round"/></svg></button>
          <div id="about"></div>
        </div>
        <div id="chatPanel" class="rp lp">                                        <!-- Chat -->
          <div id="chatView"></div>
          <div id="chatInputBar">
            <input type="text" id="chatInput" placeholder="Message..." maxlength="100" onkeydown="if(event.key==='Enter')chatSendPressed()">
            <button id="chatSendBtn" title="Send" aria-label="Send" onclick="chatSendPressed()"><svg viewBox="0 0 14 20" aria-hidden="true"><path d="M3 2.5L11 10L3 17.5" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>
        <div id="opSw" class="rp op"></div>                                       <!-- Settings: four orange panels. Switch Device (online games only) -->
        <div id="opMute" class="rp op"></div>                                     <!-- Mute -->
        <div id="opSfx" class="rp op"></div>                                      <!-- SFX volume -->
        <div id="opMusic" class="rp op"></div>                                    <!-- Music volume, song, play / loop / shuffle -->
      </div>
      <div id="log" style="display:none"></div>  <!-- hidden: collects the log lines for the Combat log window -->
    </div>
    <div id="fly"></div>                         <!-- layer for thrown / sliding items -->
    <div id="setup"></div>                       <!-- start screen (setup) -->
    <div id="title"></div>                       <!-- title screen: logo, Play / Options / About (js/title.js) -->
    <div id="tLoad"><div class="ld-bar"><i></i></div><span class="ld-ok"><svg viewBox="0 0 12 10" width="12" height="10"><path d="M1 5.5L4.5 9 11 1.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>Assets loaded</span></div>
    <div id="tCopy">Copyright &copy; 2026 Hafiz Shaikh. All Rights Reserved.<span class="tc-sub">Copying, modifying, distributing or reusing this game's code, artwork or audio without written permission is prohibited.</span></div>   <!-- copyright notice, bottom middle of the title screens (see LICENSE.md) -->
    <div id="modal" onclick="if(event.target===this)this.style.display='none'"></div>                       <!-- pop-up windows (rulebook etc.) -->
  </div>
  <!-- The tab buttons live OUTSIDE the stage so they stick to the bottom-right corner of the real window (css #dockfix; shown by main.js while a game is on screen). -->
  <div id="dockfix"><div id="dock"></div><div id="topbtns"></div></div>
  <!-- The code, in loading order (each file only uses things from the files above it). -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/config.js?v=22"></script>
  <script src="js/board.js?v=22"></script>
  <script src="js/art.js?v=22"></script>
  <script src="js/audio.js?v=22"></script>
  <script src="js/preload.js?v=22"></script>
  <script src="js/render.js?v=22"></script>
  <script src="js/network.js?v=22"></script>
  <script src="js/input.js?v=22"></script>
  <script src="js/rules.js?v=22"></script>
  <script src="js/rulebook.js?v=22"></script>
  <script src="js/main.js?v=22"></script>
  <script src="js/title.js?v=22"></script>
  <script src="js/local.js?v=22"></script>
</body>
</html>
